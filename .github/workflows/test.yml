# .github/workflows/api-test.yml
name: API Automation Test

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Test Code
        uses: actions/checkout@v4
      
      - name: Checkout Backend Code
        uses: actions/checkout@v4
        with:
          repository: ling0917/agile-backend
          path: backend
      
      - name: Unzip Backend
        run: |
          cd backend
          ls -la
          unzip -o agile-upload.zip
          echo "=== Check structure ==="
          ls -R | grep -E "(docker-compose|pom.xml)" | head -20
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Build Backend JAR
        run: |
          if [ -d "backend/agile-upload/agile-upload" ] && [ -f "backend/agile-upload/agile-upload/pom.xml" ]; then
            cd backend/agile-upload/agile-upload
          elif [ -f "backend/agile-upload/pom.xml" ]; then
            cd backend/agile-upload
          elif [ -f "backend/pom.xml" ]; then
            cd backend
          else
            echo "pom.xml not found"
            find backend -name "pom.xml" -type f
            exit 1
          fi
          
          pwd
          mvn -B -DskipTests package
          ls -la target/*.jar
      
      - name: Start Services with Docker Compose
        run: |
          if [ -d "backend/agile-upload/agile-upload" ] && [ -f "backend/agile-upload/agile-upload/docker-compose.yml" ]; then
            cd backend/agile-upload/agile-upload
          elif [ -f "backend/agile-upload/docker-compose.yml" ]; then
            cd backend/agile-upload
          elif [ -f "backend/docker-compose.yml" ]; then
            cd backend
          else
            echo "docker-compose.yml not found"
            find backend -name "docker-compose.yml" -type f
            exit 1
          fi
          
          pwd
          ls -la
          ls docker/mysql/init/
          
          cat > .env << EOF
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          MYSQL_ROOT_PASSWORD=123456
          SPRING_DATASOURCE_USERNAME=root
          SPRING_DATASOURCE_PASSWORD=123456
          EOF
          
          docker compose down -v 2>/dev/null || true
          docker compose up -d --build
          
          sleep 60
          docker ps
          docker logs agile-app
      
      - name: Test Backend Health
        run: |
          for i in {1..30}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8084/auth/ping || echo "000")
            if [ "$response" = "200" ]; then
              echo "✅ Backend is ready!"
              break
            fi
            echo "⏳ Waiting for backend... attempt $i/30"
            sleep 2
          done
      
      - name: Unzip Test Project
        run: |
          ls -la
          unzip -o project.zip
          ls -la project/
          
          # 只清理根目录的旧测试文件，保留 data/test_data.yaml
          rm -f project/test_fixture.py 2>/dev/null || true
          rm -f project/test_httpbin.py 2>/dev/null || true
          rm -f project/test_order.py 2>/dev/null || true
          rm -f project/test_parametrize.py 2>/dev/null || true
          rm -f project/test_yaml.py 2>/dev/null || true
          rm -f project/try.py 2>/dev/null || true
          rm -f project/trypost.py 2>/dev/null || true
          rm -rf project/.pytest_cache 2>/dev/null || true
          rm -rf project/__pycache__ 2>/dev/null || true
          rm -rf project/testcases/__pycache__ 2>/dev/null || true
          rm -rf project/testcases/base/__pycache__ 2>/dev/null || true
          
          echo "=== Cleaned test files ==="
          ls project/testcases/
          echo "=== Data files ==="
          ls project/data/
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Dependencies
        run: |
          cd project
          pip install pytest allure-pytest requests PyYAML pymysql
      
      - name: Run Tests
        run: |
          cd project
          rm -rf .pytest_cache
          rm -rf reports/allure-results/*
          python -m pytest testcases/ -v --alluredir=reports/allure-results
      
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: project/reports/allure-results
      
      - name: Generate Allure Report
        if: always()
        run: |
          cd project
          wget -q https://github.com/allure-framework/allure2/releases/download/2.24.1/allure-2.24.1.tgz
          tar -xzf allure-2.24.1.tgz
          
          # 直接用之前的结果，不重新跑测试
          ./allure-2.24.1/bin/allure generate reports/allure-results -o allure-report --clean
          
          echo "=== Test cases count ==="
          ls allure-report/data/test-cases/ | wc -l
      
      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: project/allure-report
          force_orphan: true
      
      - name: Cleanup Docker
        if: always()
        run: |
          if [ -d "backend/agile-upload/agile-upload" ]; then
            cd backend/agile-upload/agile-upload
          elif [ -d "backend/agile-upload" ]; then
            cd backend/agile-upload
          elif [ -d "backend" ]; then
            cd backend
          else
            echo "No backend directory found, skipping cleanup"
            exit 0
          fi
          docker compose down -v
