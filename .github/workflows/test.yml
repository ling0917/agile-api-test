name: API Automation Test

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: agile
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    
    steps:
      - name: Checkout Test Code
        uses: actions/checkout@v4
      
      - name: Checkout Backend Code
        uses: actions/checkout@v4
        with:
          repository: ling0917/agile-backend
          path: backend
      
      - name: Unzip Backend
        run: |
          cd backend
          ls -la
          unzip agile-upload.zip || unzip agile.zip || ls -R
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Build Backend
        run: |
          cd backend/agile-upload || cd backend/agile
          mvn clean package -DskipTests
      
      - name: Start Backend
        run: |
          cd backend/agile-upload || cd backend/agile
          java -jar target/agile-1.0-SNAPSHOT.jar &
          sleep 60
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3307/agile?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: 123456
      
      - name: Unzip Test Project
        run: |
          unzip project.zip
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Dependencies
        run: |
          cd project
          pip install pytest==8.3.3 allure-pytest==2.13.5 requests==2.32.3 PyYAML==6.0.2 pymysql==1.1.1
      
      - name: Run Tests
        run: |
          cd project
          python -m pytest testcases/ -v --alluredir=reports/allure-results
      
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: project/reports/allure-results
