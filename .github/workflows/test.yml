name: API Automation Test

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Test Code
        uses: actions/checkout@v4
      
      - name: Checkout Backend Code
        uses: actions/checkout@v4
        with:
          repository: ling0917/agile-backend
          path: backend
      
      - name: Unzip Backend
        run: |
          cd backend
          ls -la
          unzip -o agile-upload.zip
          ls -la
          echo "=== Docker folder ==="
          ls -R docker/
      
      - name: Start Services with Docker Compose
        run: |
          cd backend/agile-upload
          # 创建 .env 文件
          cat > .env << EOF
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          MYSQL_ROOT_PASSWORD=123456
          SPRING_DATASOURCE_USERNAME=root
          SPRING_DATASOURCE_PASSWORD=123456
          EOF
          cat .env
          # 清理旧容器
          docker compose down -v 2>/dev/null || true
          # 启动服务
          docker compose up -d
          # 等待服务就绪
          echo "Waiting for services..."
          sleep 60
          # 检查状态
          echo "=== Docker PS ==="
          docker ps
          echo "=== MySQL Logs ==="
          docker logs agile-mysql 2>&1 | tail -20
          echo "=== App Logs ==="
          docker logs agile-app 2>&1 | tail -30
      
      - name: Test Backend Health
        run: |
          # 测试后端是否响应
          for i in {1..10}; do
            curl -s http://localhost:8084/auth/ping && echo "BACKEND OK" && break
            echo "Waiting for backend... attempt $i"
            sleep 5
          done
      
      - name: Unzip Test Project
        run: |
          ls -la
          unzip -o project.zip
          ls -la project/
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Dependencies
        run: |
          cd project
          pip install pytest allure-pytest requests PyYAML pymysql
      
      - name: Run Tests
        run: |
          cd project
          python -m pytest testcases/ -v --alluredir=reports/allure-results
      
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: project/reports/allure-results
      
      - name: Cleanup Docker
        if: always()
        run: |
          cd backend/agile-upload
          docker compose down -v
